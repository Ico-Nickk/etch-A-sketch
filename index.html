<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="styleSheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <button id="mainButton">click me!</button>
    <div class="mainBox">
    </div>

    <script>
        const parentContainer = document.querySelector(".mainBox");

        function createASquare (num) {
            for (let i = 0; i < num; i++) {
                const square = document.createElement("div");
                square.classList.add("square");
                parentContainer.appendChild(square);
            };
        };

        const boxes = document.querySelectorAll(".square");
        
        boxes.forEach(box => {
            box.addEventListener("mouseover", e => {
                box.setAttribute("style", "background-color: white;");
            });
        });

        const bttn = document.getElementById("mainButton");

        bttn.addEventListener("click", () => {
            let boxNum = prompt("enter grid number");
            createASquare(boxNum);
            console.log(boxNum);

        });
  

    </script>
    
</body>
</html>
